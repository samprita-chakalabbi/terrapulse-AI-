<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TerraPulse AI</title>
<style>
:root{--bg:#f6f5ef;--c:#fff;--t:#1d2b22;--m:#667568;--g:#1f5a3a;--e:#2f9e6b;--b:#e1e0d4;--r:#c0392b;--a:#b87413;--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a15;--c:#1b261f;--t:#e8efe9;--m:#9bab9e;--g:#6fd0a0;--e:#3fbf86;--b:#2c3a31;--r:#ff7b6b;--a:#f0b35a;--bt:#0d1a12}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.logo{font-weight:700;color:var(--g);display:flex;align-items:center;gap:6px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--c);border-bottom:1px solid var(--b)}
nav a{padding:6px 12px;border-radius:99px;color:var(--m);text-decoration:none;white-space:nowrap;font-size:14px}nav a.on{background:var(--g);color:var(--bt)}
main{max-width:980px;margin:auto;padding:14px}h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.big{font-size:26px;font-weight:700;color:var(--g)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}.demo{color:var(--a)}
.ok{color:var(--e)}.warn{color:var(--a)}.bad{color:var(--r)}.mut{color:var(--m);font-size:13px}
button,.btn{background:var(--g);color:var(--bt);border:0;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.s{background:transparent;color:var(--g);border:1px solid var(--g)}button.d{background:var(--r);color:#fff}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;margin:3px 0 8px}
label{font-size:13px;color:var(--m)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left}
.wrap{overflow-x:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.err{color:var(--r);font-size:13px}
.hero{padding:26px 14px;text-align:center}.hero h1{font-size:28px}
@media print{header,nav,button{display:none}}
</style></head><body>
<header><span class="logo"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 21C5 10 11 4 22 4c0 11-6 17-17 17z"/><path d="M5 21 14 12"/><path d="M2 15q-1 3 0 6M23 22q1-3 0-6" opacity=".6"/></svg>TerraPulse AI</span>
<span class="tag demo">Demo Data</span><span style="flex:1"></span><label style="margin:0">Role (demo switcher – not real auth)</label>
<select id="role" style="width:auto;margin:0"><option value="admin">Administrator</option><option value="manager">Restoration Manager</option><option value="volunteer">Field Volunteer</option><option value="funder">Funder / Viewer</option></select></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const NOW=Date.now(),DAY=864e5,iso=t=>new Date(t).toISOString().slice(0,10);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const SEED=()=>{const mk=(vals,shift=0)=>vals.map((v,i)=>({d:iso(NOW-(vals.length-1-i)*30*DAY-shift*DAY),v}));return{
sites:[{id:1,name:"Kodagu Shola Reforestation (sample)",type:"Forest restoration",lat:12.42,lon:75.74,ha:42,org:"Sample NGO",status:"Monitored",desc:"Fictional sample site",ndvi:mk([.38,.42,.47,.52,.56,.6])},
{id:2,name:"Cauvery Watershed Recovery (sample)",type:"Watershed recovery",lat:12.3,lon:76.65,ha:18.5,org:"Sample Forest Dept",status:"Monitored",desc:"Fictional sample site",ndvi:mk([.5,.49,.45,.4,.35,.31])},
{id:3,name:"Bellary Degraded Land Patch (sample)",type:"Degraded-land restoration",lat:15.14,lon:76.92,ha:60,org:"Sample CSR Trust",status:"Monitored",desc:"Fictional sample site",ndvi:mk([.2,.22,.2,.25,.24,.27])},
{id:4,name:"Bandipur Buffer Planting (sample)",type:"Forest restoration",lat:11.67,lon:76.63,ha:25,org:"Sample NGO",status:"Monitored",desc:"Fictional sample site",ndvi:mk([.45,.5,.52,.5],75)},
{id:5,name:"Chikkamagaluru New Plot (sample)",type:"Forest restoration",lat:13.32,lon:75.77,ha:10,org:"Sample NGO",status:"Monitored",desc:"Too few observations",ndvi:mk([.3,.33])}],
obs:[{id:1,site:2,cat:"Dry vegetation",note:"Leaves browning near stream bank, saplings wilting.",date:iso(NOW-6*DAY),lat:12.3,lon:76.65,st:"verified",by:"Sample volunteer",imgs:[]},
{id:2,site:2,cat:"Erosion",note:"Gully forming after rain.",date:iso(NOW-3*DAY),lat:12.31,lon:76.66,st:"unverified",by:"Sample volunteer",imgs:[]},
{id:3,site:1,cat:"Healthy growth",note:"New leaves on most saplings.",date:iso(NOW-9*DAY),lat:12.42,lon:75.74,st:"verified",by:"Sample volunteer",imgs:[]}],
al:{},log:[],th:{decline:.05,staleDays:45,negObs:2}}};
let S;try{S=JSON.parse(localStorage.getItem("tp1"))}catch(e){}if(!S)S=SEED();
const save=()=>{try{localStorage.setItem("tp1",JSON.stringify(S))}catch(e){alert("Storage failed: "+e.message)}};
const role=()=>$("role").value,$=id=>document.getElementById(id);
const can=a=>({edit:["admin","manager"],submit:["admin","manager","volunteer"],review:["admin","manager"],admin:["admin"]}[a]||[]).includes(role());
const log=m=>{S.log.unshift({t:new Date().toISOString(),u:role(),m});S.log=S.log.slice(0,50);save()};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CAT=s=>s>=80?["Positive indicators","ok"]:s>=60?["Monitor","ok"]:s>=40?["Needs inspection","warn"]:["Priority review","bad"];
function score(site,pts=site.ndvi){const n=pts.length;if(n<3)return null;const L=pts[n-1].v,avgPrev=pts.slice(Math.max(0,n-4),n-1).reduce((a,p)=>a+p.v,0)/Math.min(3,n-1);
const level=clamp((L-.15)/.55,0,1)*100,tr=L-avgPrev,trend=clamp(50+tr*400,0,100);
const vo=S.obs.filter(o=>o.site==site.id&&o.st=="verified").length;const conf=clamp((n+vo)/8,0,1);
return{s:Math.round(.7*level+.3*trend),level:Math.round(level),trend:Math.round(trend),tr,conf,n,vo,L}}
function cur(site){const x=score(site),p=score(site,site.ndvi.slice(0,-1));return x&&{...x,prev:p?p.s:null}}
function alerts(){const out=[];const T=S.th;for(const s of S.sites.filter(s=>s.status=="Monitored")){const p=s.ndvi,n=p.length;
if(n>=4){const a=p.slice(-4);if(a[1].v<a[0].v&&a[2].v<a[1].v&&a[3].v<a[2].v&&a[0].v-a[3].v>=T.decline)out.push({k:s.id+"d",site:s,sev:"High",rule:`NDVI fell 3 consecutive observations (${a[0].v} → ${a[3].v}, drop ≥ ${T.decline})`,ev:a.map(x=>x.d+": "+x.v).join("; "),lim:"Demo NDVI series; single index, cloud effects unchecked.",next:"Schedule a field inspection and compare with recent volunteer photos.",date:a[3].d})}
const last=p[n-1]&&p[n-1].d;if(!last||(NOW-new Date(last))/DAY>T.staleDays)out.push({k:s.id+"m",site:s,sev:"Medium",rule:`No observation in over ${T.staleDays} days`,ev:"Latest observation: "+(last||"none"),lim:"May reflect cloud cover or processing gaps, not site condition.",next:"Check data source status; request a field visit if gap persists.",date:iso(NOW)});
const neg=S.obs.filter(o=>o.site==s.id&&!["Healthy growth","Other"].includes(o.cat)&&o.st!="rejected"&&NOW-new Date(o.date)<30*DAY);
if(neg.length>=T.negObs)out.push({k:s.id+"o",site:s,sev:"Medium",rule:`${neg.length} negative field observations in 30 days (threshold ${T.negObs})`,ev:neg.map(o=>o.cat+" ("+o.st+")").join("; "),lim:"Includes unverified volunteer reports.",next:"Review submissions and verify on site.",date:neg[0].date})}
return out.map(a=>({...a,st:S.al[a.k]||"Open"}))}
function chart(pts,w=520,h=140){if(pts.length<2)return'<p class="mut">Not enough points to chart.</p>';const mn=Math.min(...pts.map(p=>p.v),0),mx=Math.max(...pts.map(p=>p.v),.8);
const X=i=>30+i*(w-45)/(pts.length-1),Y=v=>h-20-(v-mn)/(mx-mn)*(h-35);
return`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="NDVI trend"><path d="M30 ${h-20}H${w-10}" stroke="var(--b)"/><polyline fill="none" stroke="var(--e)" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+","+Y(p.v)).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="3.5" fill="var(--g)"/><text x="${X(i)}" y="${h-4}" font-size="9" text-anchor="middle" fill="var(--m)">${p.d.slice(5)}</text>`).join("")}<text x="2" y="${Y(pts[pts.length-1].v)+3}" font-size="9" fill="var(--m)">${pts[pts.length-1].v}</text></svg>`}
const D='<span class="tag demo">Demo Data</span>';
const badge=s=>{const x=cur(s);if(!x)return'<span class="tag mut">Insufficient data</span>';const c=CAT(x.s);return`<span class="tag ${c[1]}">${x.s} · ${c[0]}</span>`};
const siteSel=(id,all)=>`<select id="${id}">${all?'<option value="">All sites</option>':""}${S.sites.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>`;
const P={};
P.home=()=>`<div class="hero card"><h1>Every Restoration Site Has a Story. Track Its Recovery.</h1><p class="mut">Satellite-ready monitoring, an explainable health score, early-warning rules and citizen science — in one workspace. Currently running on clearly labeled sample data.</p><div class="row" style="justify-content:center"><a class="btn" href="#dash">Explore Dashboard</a><a class="btn s" style="border:1px solid var(--g);background:none;color:var(--g)" href="#sites">Add a Restoration Site</a></div></div>
<div class="grid">${[["Satellite Monitoring","Sentinel-2 NDVI pipeline (not configured yet; demo series shown)."],["Health Score","Transparent 0–100 illustrative score with visible factors."],["Early-Warning Insights","Threshold rules with evidence; no ML claims."],["Citizen Science","Geotagged photos & notes with review workflow."]].map(a=>`<div class="card"><h2>${a[0]}</h2><p class="mut">${a[1]}</p></div>`).join("")}</div>
<div class="card"><h2>How it works</h2><ol><li>Add a site with coordinates and area.</li><li>Ingest observations (demo today, Sentinel-2 later) and field reports.</li><li>Review the score, alerts and download reports.</li></ol><p class="mut">Built for restoration NGOs, communities, forest departments and funders. No environmental impact is claimed or verified by this prototype.</p></div>
<p class="mut">Eco Titans · Vidyavardhaka College of Engineering, Mysuru · Code4Nature Challenge — “Let's help restoration prove itself.”</p>`;
P.dash=()=>{const ss=S.sites.filter(s=>!s.archived),sc=ss.map(cur).filter(Boolean),avg=sc.length?Math.round(sc.reduce((a,x)=>a+x.s,0)/sc.length):"–",al=alerts().filter(a=>a.st!="Resolved"),
cats={Positive:0,Monitor:0,Inspect:0,Priority:0,Insufficient:0};ss.forEach(s=>{const x=cur(s);if(!x)cats.Insufficient++;else x.s>=80?cats.Positive++:x.s>=60?cats.Monitor++:x.s>=40?cats.Inspect++:cats.Priority++});
const avgSeries=ss[0]?ss[0].ndvi.map((_,i)=>{const v=ss.filter(s=>s.ndvi.length>i).map(s=>s.ndvi[i].v);return{d:ss[0].ndvi[i].d,v:+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(3)}}):[];
return`<h1>Dashboard ${D}</h1><div class="grid"><div class="card"><div class="mut">Total sites</div><div class="big">${ss.length}</div></div><div class="card"><div class="mut">Monitored</div><div class="big">${ss.filter(s=>s.status=="Monitored").length}</div></div><div class="card"><div class="mut">Need attention</div><div class="big">${new Set(al.map(a=>a.site.id)).size}</div></div><div class="card"><div class="mut">Avg health score</div><div class="big">${avg}</div></div><div class="card"><div class="mut">Field observations</div><div class="big">${S.obs.length}</div></div></div>
<div class="card"><h2>Mean NDVI trend (simulated)</h2>${chart(avgSeries)}</div>
<div class="card"><h2>Site comparison (illustrative score)</h2>${ss.map(s=>{const x=cur(s);return`<div class="row"><span style="flex:1;min-width:140px"><a href="#site/${s.id}">${esc(s.name)}</a></span><div style="flex:2;min-width:100px;background:var(--b);border-radius:6px;height:12px"><div style="width:${x?x.s:0}%;background:var(--e);height:12px;border-radius:6px"></div></div><span style="width:50px">${x?x.s:"n/a"}</span></div>`}).join("")}</div>
<div class="card"><h2>Risk distribution</h2>${Object.entries(cats).map(([k,v])=>`<span class="tag" style="margin-right:6px">${k}: ${v}</span>`).join("")}</div>
<div class="card"><h2>Latest alerts</h2>${al.slice(0,4).map(a=>`<p><b class="${a.sev=="High"?"bad":"warn"}">${a.sev}</b> ${esc(a.site.name)} — ${esc(a.rule)}<br><span class="mut">Next: ${esc(a.next)}</span></p>`).join("")||'<p class="mut">No open alerts.</p>'}</div>
<div class="card"><h2>Recent activity</h2>${S.log.slice(0,6).map(l=>`<p class="mut">${l.t.slice(0,16).replace("T"," ")} · ${l.u}: ${esc(l.m)}</p>`).join("")||'<p class="mut">No activity yet.</p>'}</div>`};
P.sites=()=>`<h1>Restoration sites</h1>${can("edit")?siteForm():'<p class="mut">Your role is view-only for sites.</p>'}<input id="q" placeholder="Search sites…" oninput="filt()"><div class="wrap card"><table><tr><th>Name</th><th>Type</th><th>Ha</th><th>Score</th><th></th></tr><tbody id="tb"></tbody></table></div>`;
function filt(){const q=($("q")?.value||"").toLowerCase();$("tb").innerHTML=S.sites.filter(s=>(s.name+s.type+s.org).toLowerCase().includes(q)).map(s=>`<tr><td><a href="#site/${s.id}">${esc(s.name)}</a>${s.archived?' <span class="tag mut">archived</span>':""}</td><td>${esc(s.type)}</td><td>${s.ha}</td><td>${badge(s)}</td><td>${can("edit")?`<button class="s" onclick="arch(${s.id})">${s.archived?"Restore":"Archive"}</button> <button class="d" onclick="del(${s.id})">Delete</button>`:""}</td></tr>`).join("")||'<tr><td colspan=5 class="mut">No sites match.</td></tr>'}
const siteForm=()=>`<div class="card"><h2>Add a site</h2><div id="ferr" class="err"></div><label>Name*</label><input id="n"><label>Description</label><input id="ds"><div class="row"><div style="flex:1"><label>Latitude* (-90–90)</label><input id="la" type="number" step="any"></div><div style="flex:1"><label>Longitude* (-180–180)</label><input id="lo" type="number" step="any"></div><div style="flex:1"><label>Area ha* (&gt;0)</label><input id="ha" type="number" step="any"></div></div><label>Restoration type</label><select id="ty"><option>Forest restoration</option><option>Watershed recovery</option><option>Degraded-land restoration</option></select><label>Organization</label><input id="og"><label>Start date</label><input id="sd" type="date"><button onclick="addSite()">Save site</button></div>`;
function addSite(){if(!can("edit"))return;const n=$("n").value.trim(),la=parseFloat($("la").value),lo=parseFloat($("lo").value),ha=parseFloat($("ha").value),e=[];
if(!n)e.push("Name is required.");if(!(la>=-90&&la<=90))e.push("Latitude must be −90 to 90.");if(!(lo>=-180&&lo<=180))e.push("Longitude must be −180 to 180.");if(!(ha>0))e.push("Area must be greater than 0.");
if(e.length){$("ferr").textContent=e.join(" ");return}S.sites.push({id:Date.now(),name:n,desc:$("ds").value,lat:la,lon:lo,ha,type:$("ty").value,org:$("og").value,start:$("sd").value,status:"Monitored",ndvi:[],user:true});log("Created site "+n);save();route()}
function arch(id){const s=S.sites.find(x=>x.id==id);s.archived=!s.archived;log((s.archived?"Archived ":"Restored ")+s.name);save();route()}
function del(id){const s=S.sites.find(x=>x.id==id);if(!can("edit")||!confirm("Delete "+s.name+" and its observations? This cannot be undone."))return;S.sites=S.sites.filter(x=>x.id!=id);S.obs=S.obs.filter(o=>o.site!=id);log("Deleted site "+s.name);save();route()}
P.site=id=>{const s=S.sites.find(x=>x.id==id);if(!s)return'<p>Site not found. <a href="#sites">Back</a></p>';const x=cur(s),o=S.obs.filter(o=>o.site==s.id);
return`<h1>${esc(s.name)}</h1><p class="mut">${esc(s.type)} · ${s.ha} ha · ${s.lat}, ${s.lon} · ${esc(s.org||"")} ${s.user?"":D}</p>
<div class="card"><h2>Restoration Health Score <span class="mut">(illustrative, not scientifically validated)</span></h2>${x?`<div class="big">${x.s} <span class="tag ${CAT(x.s)[1]}">${CAT(x.s)[0]}</span></div><p>Previous: ${x.prev??"n/a"} · Change: ${x.prev==null?"n/a":x.s-x.prev}</p><table><tr><td>Vegetation level (70%)</td><td>${x.level}/100 from latest NDVI ${x.L}</td></tr><tr><td>Trend (30%)</td><td>${x.trend}/100 (latest vs prior-3 avg: ${x.tr>=0?"+":""}${x.tr.toFixed(3)})</td></tr><tr><td>Confidence</td><td>${Math.round(x.conf*100)}% (${x.n} observations, ${x.vo} verified field reports). Missing data lowers confidence, not the score.</td></tr></table><p class="mut">Thresholds (initial product settings): 80–100 Positive indicators; 60–79 Monitor; 40–59 Needs inspection; 0–39 Priority review.</p><p><b>Suggested action:</b> ${x.s<60?"Plan an inspection and verify with field photos.":"Continue routine monitoring."}</p>`:'<p><b>Insufficient data</b> — at least 3 observations are needed for a score.</p>'}</div>
<div class="card"><h2>NDVI history ${s.user?"":D}</h2>${chart(s.ndvi)}</div>
<div class="card"><h2>Location</h2><p>${s.lat}, ${s.lon} — <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${s.lat}&mlon=${s.lon}#map=13/${s.lat}/${s.lon}">Open in OpenStreetMap</a> · <a href="#map">Coordinate plot</a></p></div>
<div class="card"><h2>Field observations (${o.length})</h2>${o.map(obsRow).join("")||'<p class="mut">None yet.</p>'}</div>
<div class="card"><h2>Alerts</h2>${alerts().filter(a=>a.site.id==s.id).map(a=>`<p>${a.sev}: ${esc(a.rule)} (${a.st})</p>`).join("")||'<p class="mut">None.</p>'}</div>`};
const obsRow=o=>{const st=S.sites.find(s=>s.id==o.site);return`<div style="border-top:1px solid var(--b);padding:8px 0"><b>${esc(o.cat)}</b> · ${o.date} · <span class="tag ${o.st=="verified"?"ok":o.st=="rejected"?"bad":"warn"}">${o.st=="unverified"?"Unverified":o.st}</span> ${o.demo?D:""}<br>${esc(o.note)}<br><span class="mut">${esc(st?st.name:"")} · ${o.lat??"?"}, ${o.lon??"?"} · ${esc(o.by)}</span><div>${(o.imgs||[]).map(i=>`<img src="${i}" style="height:70px;border-radius:8px;margin:4px 4px 0 0">`).join("")}</div><p class="mut">${analyze(o)}</p>${can("review")&&o.st=="unverified"?`<button onclick="rv(${o.id},'verified')">Verify</button> <button class="d" onclick="rv(${o.id},'rejected')">Reject</button>`:""}</div>`};
function analyze(o){const t=(o.note||"").toLowerCase(),w=["dry","brown","wilt","dead","erosion","gully","waterlog","damage","burn","pest"].filter(k=>t.includes(k)||o.cat.toLowerCase().includes(k));
return"Rule-based analysis (not AI, photos not analyzed): "+(w.length?`possible stress terms: ${w.join(", ")}. Human inspection recommended; this cannot establish a diagnosis.`:"no stress keywords found; this does not rule out problems.")}
function rv(id,st){if(!can("review"))return alert("Not permitted for your role.");S.obs.find(o=>o.id==id).st=st;log("Observation #"+id+" "+st);save();route()}
P.map=()=>{const ss=S.sites.filter(s=>!s.archived);if(!ss.length)return"<h1>Map</h1><p>No sites.</p>";const la=ss.map(s=>s.lat),lo=ss.map(s=>s.lon),a=Math.min(...la)-.3,b=Math.max(...la)+.3,c=Math.min(...lo)-.3,d=Math.max(...lo)+.3;
return`<h1>Site map</h1><div class="card"><p class="mut"><b>Coordinate plot, not a basemap.</b> Map tiles and a map library cannot load in this hosted build, so sites are plotted by latitude/longitude only (no terrain or boundaries). Each site links to OpenStreetMap for a real map.</p><svg viewBox="0 0 400 300" width="100%" style="background:var(--bg);border-radius:10px">${ss.map(s=>{const x=cur(s),col=!x?"#888":x.s>=80?"#2f9e6b":x.s>=60?"#d9a02f":x.s>=40?"#e0701f":"#c0392b",px=20+(s.lon-c)/(d-c)*360,py=280-(s.lat-a)/(b-a)*260;return`<a href="#site/${s.id}"><circle cx="${px}" cy="${py}" r="8" fill="${col}" stroke="#fff" stroke-width="2"/><text x="${px+11}" y="${py+4}" font-size="9" fill="var(--t)">${esc(s.name.split(" (")[0])}</text></a>`}).join("")}</svg><p class="mut">Grey = insufficient data. Green positive · amber monitor · orange needs inspection · red priority review.</p></div>`};
P.field=()=>!can("submit")?'<h1>Field report</h1><p>Your role cannot submit field observations.</p>':`<h1>Field report</h1><div class="card"><div id="ferr" class="err"></div><label>Site</label>${siteSel("fs")}<label>Photos (JPEG/PNG/WebP, ≤5 MB each; max 3 kept)</label><input id="ph" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" multiple><label>Category</label><select id="fc"><option>Healthy growth</option><option>Dry vegetation</option><option>Erosion</option><option>Waterlogging</option><option>Visible damage</option><option>Other</option></select><label>Date</label><input id="fd" type="date" value="${iso(NOW)}"><label>Notes</label><textarea id="fn" rows="3"></textarea><div class="row"><div style="flex:1"><label>Latitude</label><input id="fla" type="number" step="any"></div><div style="flex:1"><label>Longitude</label><input id="flo" type="number" step="any"></div></div><div class="row"><button class="s" onclick="geo()">Use my location</button><button onclick="subObs()">Submit</button><button class="s" onclick="draft()">Save draft</button></div><p class="mut">Photos are stored as small thumbnails in this browser only (no server storage in this build).</p></div><h2>Previous submissions</h2><div class="card">${S.obs.map(obsRow).join("")}</div>`;
function geo(){if(!navigator.geolocation)return $("ferr").textContent="Geolocation unsupported; enter coordinates manually.";navigator.geolocation.getCurrentPosition(p=>{$("fla").value=p.coords.latitude.toFixed(5);$("flo").value=p.coords.longitude.toFixed(5)},e=>$("ferr").textContent="Location denied/unavailable ("+e.message+"). Enter coordinates manually.")}
function draft(){try{localStorage.setItem("tpd",JSON.stringify({n:$("fn").value,c:$("fc").value}));$("ferr").textContent="";alert("Draft saved locally (not submitted).")}catch(e){alert("Draft failed")}}
function thumb(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(new Error("Read failed"));r.onload=()=>{const i=new Image();i.onerror=()=>no(new Error("Not a valid image"));i.onload=()=>{const k=Math.min(1,320/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7))};i.src=r.result};r.readAsDataURL(f)})}
async function subObs(){if(!can("submit"))return;const e=$("ferr"),fs=[...$("ph").files],ok=["image/jpeg","image/png","image/webp"];const n=$("fn").value.trim(),la=$("fla").value===""?null:+$("fla").value,lo=$("flo").value===""?null:+$("flo").value;
if(!n)return e.textContent="Add a field note.";if(la!=null&&!(la>=-90&&la<=90)||lo!=null&&!(lo>=-180&&lo<=180))return e.textContent="Coordinates out of range.";
for(const f of fs){if(!ok.includes(f.type))return e.textContent=f.name+": unsupported type.";if(f.size>5e6)return e.textContent=f.name+": over 5 MB."}
try{const imgs=[];for(const f of fs.slice(0,3))imgs.push(await thumb(f));S.obs.unshift({id:Date.now(),site:+$("fs").value,cat:$("fc").value,note:n,date:$("fd").value,lat:la,lon:lo,st:"unverified",by:role(),imgs});log("Field observation submitted");save();route()}catch(x){e.textContent="Submit failed: "+x.message+" — you can retry."}}
P.review=()=>`<h1>Review queue</h1>${can("review")?`<div class="card">${S.obs.filter(o=>o.st=="unverified").map(obsRow).join("")||'<p class="mut">Nothing awaiting review.</p>'}</div>`:"<p>Only managers and administrators can review.</p>"}`;
P.alerts=()=>`<h1>Alerts</h1><p class="mut">Transparent threshold rules (configurable in Settings). No ML model is implemented.</p>${alerts().map(a=>`<div class="card"><b class="${a.sev=="High"?"bad":"warn"}">${a.sev}</b> · ${esc(a.site.name)} · detected ${a.date} · <b>${a.st}</b><p>Rule: ${esc(a.rule)}</p><p class="mut">Evidence: ${esc(a.ev)}<br>Limitation: ${esc(a.lim)}</p><p>Next step: ${esc(a.next)}</p>${can("review")?["Open","Under Review","Resolved"].map(t=>`<button class="${a.st==t?"":"s"}" onclick="setAl('${a.k}','${t}')">${t}</button> `).join(""):""}</div>`).join("")||'<p class="mut">No alerts triggered.</p>'}`;
function setAl(k,t){if(!can("review"))return;S.al[k]=t;log("Alert "+k+" → "+t);save();route()}
P.sat=()=>`<h1>Satellite monitoring</h1><div class="card"><b class="warn">Satellite integration not configured.</b><p class="mut">No Sentinel-2 / Earth Engine / STAC credentials are connected, and this static page cannot call them securely. The series below is a simulated demo dataset ${D}. No imagery is shown. RGB photos are not multispectral and are never used for NDVI.</p></div><div class="card">${siteSel("ss")}<div id="sv"></div><p class="mut">When real bands exist: NDVI = (NIR − Red) / (NIR + Red), valid range −1 to 1, zero denominators masked. A single NDVI value does not prove biodiversity, soil quality or restoration success.</p></div>`;
function satView(){const s=S.sites.find(x=>x.id==$("ss").value);$("sv").innerHTML=!s?"":`<p class="mut">Source: simulated demo · Cloud cover: unavailable · Processing: not run</p>${chart(s.ndvi)}<table><tr><th>Date</th><th>NDVI (simulated)</th></tr>${s.ndvi.map(p=>`<tr><td>${p.d}</td><td>${p.v}</td></tr>`).join("")||'<tr><td colspan=2>No data — low confidence.</td></tr>'}</table>`}
P.reports=()=>`<h1>Reports</h1><div class="card"><div class="row"><div>${siteSel("rs",1)}</div><div><input id="r1" type="date" value="${iso(NOW-365*DAY)}"></div><div><input id="r2" type="date" value="${iso(NOW)}"></div><button onclick="rep()">Generate</button></div><div id="ro"></div></div>`;
function rep(){const id=$("rs").value,a=$("r1").value,b=$("r2").value,ss=S.sites.filter(s=>!id||s.id==id);let csv="site,date,ndvi,source\n";
let h=ss.map(s=>{const p=s.ndvi.filter(x=>x.d>=a&&x.d<=b);p.forEach(x=>csv+=`"${s.name.replace(/"/g,'""')}",${x.d},${x.v},${s.user?"user":"simulated demo"}\n`);const o=S.obs.filter(o=>o.site==s.id&&o.date>=a&&o.date<=b),x=cur(s);
return`<div class="card"><h2>${esc(s.name)} ${s.user?"":D}</h2><p>Score: ${x?x.s+" (illustrative), confidence "+Math.round(x.conf*100)+"%":"Insufficient data"} · NDVI points: ${p.length} · Observations: ${o.length} (${o.filter(q=>q.st=="verified").length} verified) · Open alerts: ${alerts().filter(q=>q.site.id==s.id&&q.st!="Resolved").length}</p>${chart(p)}</div>`}).join("");
$("ro").innerHTML=`<p class="mut">Period ${a} to ${b}. Methodology: illustrative score = 70% latest-NDVI level + 30% short-term trend; confidence from observation count. Simulated values are demo only; no hectares, carbon or biodiversity figures are estimated.</p>${h}<button onclick="print()">Print / save as PDF</button> <button class="s" onclick="navigator.clipboard.writeText($('cv').value).then(()=>alert('CSV copied'))">Copy CSV</button><textarea id="cv" rows="6" readonly>${esc(csv)}</textarea>`}
P.settings=()=>`<h1>Settings & integrations</h1><div class="card"><h2>Integration status</h2><table>${[["Authentication","Not configured — demo role switcher only, no real security"],["Database","Not configured — browser localStorage only"],["Image storage","Not configured — thumbnails in browser"],["Map tiles","Unavailable in this build"],["Satellite data","Not configured"],["AI analysis","Not configured — rule-based fallback active"]].map(r=>`<tr><td>${r[0]}</td><td class="warn">${r[1]}</td></tr>`).join("")}</table></div>
${can("admin")?`<div class="card"><h2>Alert thresholds</h2><label>NDVI decline over 3 steps</label><input id="t1" type="number" step=".01" value="${S.th.decline}"><label>Stale days</label><input id="t2" type="number" value="${S.th.staleDays}"><label>Negative observations (30 d)</label><input id="t3" type="number" value="${S.th.negObs}"><button onclick="S.th={decline:+t1.value,staleDays:+t2.value,negObs:+t3.value};log('Thresholds updated');save();alert('Saved')">Save</button> <button class="d" onclick="if(confirm('Reset all data to demo?')){S=SEED();save();route()}">Reset demo data</button></div>`:'<p class="mut">Administrator-only settings hidden for your role. Note: this is client-side only; real backend authorization is not implemented.</p>'}
<div class="card"><h2>Audit log</h2>${S.log.map(l=>`<p class="mut">${l.t.slice(0,16).replace("T"," ")} · ${l.u}: ${esc(l.m)}</p>`).join("")||'<p class="mut">Empty.</p>'}</div>`;
const NAV=[["home","Home"],["dash","Dashboard"],["sites","Sites"],["map","Map"],["field","Field report"],["review","Review"],["alerts","Alerts"],["sat","Satellite"],["reports","Reports"],["settings","Settings"]];
function route(){const [p,a]=(location.hash||"#home").slice(1).split("/"),k=P[p]?p:"home";$("nav").innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==k?"on":""}">${n[1]}</a>`).join("");$("app").innerHTML=P[k](a);
if(k=="sites")filt();if(k=="sat"){$("ss").onchange=satView;satView()}}
$("role").value=S.role||"manager";$("role").onchange=()=>{S.role=role();save();route()};
addEventListener("hashchange",route);route();
</script></body></html>
